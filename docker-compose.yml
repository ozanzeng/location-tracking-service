name: geofence

x-api-env: &api-env
  NODE_ENV: production
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: geofence
  DB_PASSWORD: geofence
  DB_NAME: geofence
  DB_POOL_SIZE: 20
  REDIS_URL: redis://redis:6379
  WORKER_CONCURRENCY: 32
  # Yerel demo anahtarı; gerçek ortamda secret olarak verilmeli.
  API_KEYS: ${API_KEY:-dev-api-key}
  RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-60}

services:
  postgres:
    # Resmi postgis/postgis imajı sadece amd64; bu imaj arm64'ü de destekliyor.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: geofence
      POSTGRES_PASSWORD: geofence
      POSTGRES_DB: geofence
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      # synchronous_commit varsayılan (on): giriş kayıtları diske yazılınca onaylanır.
      # Giriş/çıkış olmayan konumlarda uygulama transaction içinde gevşetir (GeofenceService).
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/99-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofence -d geofence"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    # Kuyruk diske yazılır (AOF, saniyede bir): Redis yeniden başlarsa bekleyen konumlar kaybolmaz.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./api
    command: ["node", "dist/database/migrate.js"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    command: ["node", "dist/main.js"]
    environment:
      <<: *api-env
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./api
    command: ["node", "dist/worker.js"]
    environment: *api-env
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Operasyon: canlı harita, giriş kayıtları, alan yönetimi
  ops:
    build:
      context: ./clients
      args:
        APP: ops
    environment:
      # Anahtar tarayıcıya gönderilmez; nginx API isteklerine ekler.
      API_KEY: ${API_KEY:-dev-api-key}
    ports:
      - "${OPS_PORT:-8080}:80"
    depends_on:
      - api

  # Sürücü: konumu 5 saniyede bir gönderen cihaz uygulaması
  driver:
    build:
      context: ./clients
      args:
        APP: driver
    environment:
      API_KEY: ${API_KEY:-dev-api-key}
    ports:
      - "${DRIVER_PORT:-8081}:80"
    depends_on:
      - api

  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://api:3000
      API_KEY: ${API_KEY:-dev-api-key}
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/results:/results
    entrypoint: ["k6"]
    command: ["run", "/scripts/locations.k6.js"]
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
