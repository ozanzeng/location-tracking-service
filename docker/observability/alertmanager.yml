# Alarmlar Alertmanager arayüzünde (:9093) görünür. Bildirim için bir alıcı eklenir, örneğin:
#   receivers:
#     - name: default
#       slack_configs:
#         - api_url_file: /run/secrets/slack_webhook
#           channel: "#konum-servisi"
route:
  receiver: default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
