# Prometheus: API ve worker metriklerini kazır, alarm kurallarını değerlendirir.
# docker compose --profile observability up -d ile açılır (README, "Gözlemlenebilirlik").
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Servis adı her replikanın adresine çözülür (DNS): ölçeklenince yeni kopyalar da kazınır.
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 3000
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
